# Metade central do split (ver zmk/app/boards/shields/sofle/Kconfig.defconfig).
#
# O padrao do ZMK e ZMK_SPLIT_BLE_PREF_LATENCY=30: a metade periferica pode
# pular ate 30 eventos de conexao antes de responder (~225ms com o intervalo
# padrao de 7,5ms). Isso economiza bateria, mas atrasa em lote os eventos da
# metade direita e faz as teclas sairem fora de ordem ao digitar rapido.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# O central recebe os eventos do periferico em peripheral_event_msgq
# (zmk/app/src/split/bluetooth/central.c:146). O padrao do ZMK e
# ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=5 e o enfileiramento em
# split_central_notify_func() e feito com K_NO_WAIT descartando o retorno:
#
#   k_msgq_put(&peripheral_event_msgq, &ev, K_NO_WAIT);   // central.c:385
#
# Ou seja, com a fila cheia o evento de tecla e perdido em silencio, sem log e
# sem retry. Cada notificacao do lado direito enfileira um evento por posicao
# alterada, entao cinco slots estouram facil ao digitar rapido. Um press
# perdido some com a letra; um release perdido deixa a tecla presa e repetindo.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=40
