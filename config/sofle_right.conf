# Metade periferica do split (ver zmk/app/boards/shields/sofle/Kconfig.defconfig).
#
# O periferico enfileira snapshots do estado das teclas em position_state_msgq
# (zmk/app/src/split/bluetooth/service.c) antes de notificar o central. O padrao
# do ZMK e ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=10 e, quando a fila
# enche, send_position_state() descarta o snapshot mais antigo:
#
#   LOG_WRN("Position state message queue full, popping first message and queueing again");
#
# Ao digitar rapido a rajada estoura a fila e os snapshots descartados viram
# teclas perdidas ou fora de ordem. Uma fila maior absorve a rajada.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=40
