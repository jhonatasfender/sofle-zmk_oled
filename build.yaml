# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano_v2
    shield: sofle_left
  - board: nice_nano_v2
    shield: sofle_right
  # Mesmos firmwares, porem com log por USB habilitado. Use apenas para
  # diagnosticar o split: conecte a metade por cabo e leia a serial para ver
  # desconexoes, fila cheia e renegociacao de parametros de conexao.
  - board: nice_nano_v2
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
    artifact-name: sofle_left_logging
  - board: nice_nano_v2
    shield: sofle_right
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
    artifact-name: sofle_right_logging
